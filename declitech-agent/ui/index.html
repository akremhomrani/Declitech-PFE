<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>DecliTech - Session Report</title>
  <link rel="stylesheet" href="/ui/static/style.css"/>
</head>
<body>
  <div class="page">

    <div class="top">
      <div class="who">
        <div class="avatar"></div>
        <div class="who-text">
          <div class="name" id="studentName">Student</div>
          <div class="sub" id="studentSub">Loading...</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn soft" id="btnExport">Export Report</button>
        <button class="btn primary" id="btnReload">Reload</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <div>
          <div class="card-title">Real-time Emotion Analysis</div>
          <div class="card-sub">AI-detected emotional states for current session</div>
        </div>
        <div class="live"><span class="dot"></span>LIVE DETECTION</div>
      </div>

      <div class="bar" id="bar"></div>
      <div class="chips" id="chips"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="card-title">Behavior Intelligence Log</div>
        <div class="filter">Alert Filtered</div>
      </div>
      <div id="logs"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="card-title">Instructor Notes</div>
      </div>

      <textarea class="notes" placeholder="Type observations about student emotional state or session performance..."></textarea>
      <div class="notes-actions">
        <button class="btn soft">+ Add Note</button>
      </div>
    </div>

    <div class="footer" id="footer"></div>
  </div>

  <script src="/ui/static/app.js"></script>
</body>
</html>
