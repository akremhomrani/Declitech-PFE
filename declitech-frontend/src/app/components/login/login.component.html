<div class="login-container">

  <!-- Mouse spotlight -->
  <div class="spotlight"></div>

  <!-- Animated background particles -->
  <div class="particles">
    <span *ngFor="let p of particles" class="particle" [style.left.%]="p.x" [style.top.%]="p.y"
      [style.width.px]="p.size" [style.height.px]="p.size" [style.animation-delay.s]="p.delay"
      [style.animation-duration.s]="p.duration"></span>
  </div>

  <!-- Glowing orbs in background -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Main content -->
  <div class="content" [class.ready]="animationDone">

    <!-- Logo + brand -->
    <div class="brand">
      <div class="logo-icon">
        <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 6H42L36 24L42 42H6L12 24L6 6Z" fill="currentColor"></path>
        </svg>
      </div>
      <h1 class="brand-name">DecliTrack</h1>
    </div>

    <!-- Tagline -->
    <p class="tagline">AI-Powered Student Monitoring</p>

    <!-- Divider line -->
    <div class="divider"></div>

    <!-- Error message -->
    <div *ngIf="errorMessage" class="error-box">
      <svg viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
          clip-rule="evenodd" />
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <!-- Loading state -->
    <div *ngIf="isLoading" class="loading-state">
      <div class="spinner"></div>
      <span>Authenticating…</span>
    </div>

    <!-- SSO Button -->
    <button *ngIf="!isLoading" type="button" class="sso-btn" (click)="loginWithIAM('staff')">
      <span class="sso-btn-glow"></span>
      <svg class="sso-icon" fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 6H42L36 24L42 42H6L12 24L6 6Z" fill="currentColor"></path>
      </svg>
      <span class="sso-label">Sign in with DecliIAM</span>
      <svg class="sso-arrow" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </button>

    <p class="contact-hint">No account? <a href="#">Contact Administrator</a></p>
  </div>
</div>
