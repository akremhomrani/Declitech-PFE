name: Deploy to VPS

on:
  push:
    branches: [master]

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 40m
          script: |
            set -e

            BACKEND=/var/www/declitech/declitech-backend
            LOGS=/var/www/declitech/logs
            JAR_PATTERN="$BACKEND/.*/target/.*\.jar"
            mkdir -p "$LOGS"

            cd /var/www/declitech
            echo "=== Pulling master ==="
            git fetch origin master
            git reset --hard origin/master

            echo "=== Building frontend ==="
            cd declitech-frontend
            npm install
            npx ng build --configuration production

            echo "=== Building backend ==="
            cd "$BACKEND"
            for service in eureka-server gateway-service auth-service user-service module-service session-service report-service; do
              echo "--- Building $service ---"
              ( cd "$service" && mvn clean package -Dmaven.test.skip=true -B )
            done

            echo "=== Restarting services ==="
            pkill -f "$JAR_PATTERN" || true
            sleep 5

            start_service() {
              name=$1
              cd "$BACKEND/$name"
              if [ -f .env ]; then set -a && . ./.env && set +a; fi
              setsid java -jar target/*.jar < /dev/null > "$LOGS/$name.log" 2>&1 &
              echo "started $name"
            }

            start_service eureka-server
            sleep 20

            for s in gateway-service auth-service user-service module-service session-service report-service; do
              start_service "$s"
            done

            sudo nginx -t && sudo systemctl reload nginx

            sleep 10
            echo "=== Running java services: $(pgrep -fc 'java -jar') / 7 ==="
            echo "Deployment complete"
