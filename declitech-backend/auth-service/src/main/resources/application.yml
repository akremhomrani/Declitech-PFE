server:
  port: 8083

spring:
  application:
    name: auth-service

# Service URLs for proxying
services:
  user-service:
    url: http://localhost:8082
  session-service:
    url: http://localhost:8084
  report-service:
    url: http://localhost:8081
  module-service:
    url: http://localhost:8085

gateway:
  secret: declitech-gateway-secret-2024
  require-header: false

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:ZGVjbGl0ZWNoLXNlY3VyZS1rZXktZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9uLTIwMjYtdmVyeS1zZWN1cmUtY2hhbmdlLWluLXByb2R1Y3Rpb24=}
  expiration: 86400000  # 24 hours in milliseconds
  refresh-expiration: 604800000  # 7 days in milliseconds

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.declitech.auth: INFO
    org.springframework.security: WARN
    feign: WARN
