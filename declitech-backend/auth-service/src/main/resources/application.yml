server:
  port: 8083

spring:
  application:
    name: auth-service

gateway:
  secret: ${GATEWAY_SECRET:declitech-gateway-secret-dev-change-in-production}
  require-header: false

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:ZGVjbGl0ZWNoLXNlY3VyZS1rZXktZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9uLTIwMjYtdmVyeS1zZWN1cmUtY2hhbmdlLWluLXByb2R1Y3Rpb24=}
  expiration: 86400000  # 24 hours in milliseconds
  refresh-expiration: 604800000  # 7 days in milliseconds

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

sso:
  iam-base-url: ${SSO_IAM_BASE_URL:https://iam-staging.decli.tech}
  client-id: ${SSO_CLIENT_ID:declitrack-staging}
  redirect-uri: ${SSO_REDIRECT_URI:http://localhost:4200/auth/callback}
  student-auth-path: /api/v1/sso/auth/student
  staff-auth-path: /api/v1/sso/auth/staff
  student-exchange-path: /api/v1/sso/exchange
  staff-exchange-path: /api/v1/sso/staff/exchange

logging:
  level:
    com.declitech.auth: INFO
    org.springframework.security: WARN
    feign: WARN
