server:
  port: 8081

spring:
  application:
    name: report-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/declitech_reports
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: admin
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  
  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: declitech-alert-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    topic:
      participant-alerts: participant-alerts

gateway:
  secret: declitech-gateway-secret-2024
  require-header: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30

# Python Agent Configuration
declitech:
  agent:
    report-path: D:/PFE_Declitech/declitech-agent/emotion_report.json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
