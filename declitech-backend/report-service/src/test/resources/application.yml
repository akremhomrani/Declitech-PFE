spring:
  datasource:
    url: jdbc:h2:mem:testdb_reports;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

kafka:
  bootstrap-servers: localhost:9092

logging:
  level:
    root: WARN
