server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:

        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/auth/**

        - id: mock-iam
          uri: ${AUTH_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/mock/**

        - id: alerts
          uri: ${REPORT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/alerts/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

        - id: reports-track
          uri: ${REPORT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/reports/track
            - Method=POST

        - id: emotions
          uri: ${REPORT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/emotions/**
          filters:
            - RewritePath=/api/emotions(?<segment>.*), /api/reports${segment}

        - id: reports
          uri: ${REPORT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/reports/**

        - id: sessions
          uri: ${SESSION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/sessions/**

        - id: modules
          uri: ${MODULE_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/modules/**

      default-filters:
        - name: AddResponseHeader
          args:
            name: X-Content-Type-Options
            value: nosniff
        - name: AddResponseHeader
          args:
            name: X-Frame-Options
            value: DENY
        - name: AddResponseHeader
          args:
            name: X-XSS-Protection
            value: "1; mode=block"
        - name: AddResponseHeader
          args:
            name: Referrer-Policy
            value: strict-origin-when-cross-origin
        - name: AddResponseHeader
          args:
            name: Permissions-Policy
            value: "camera=(), microphone=(), geolocation=()"

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - ${FRONTEND_URL:http://localhost:4200}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - '*'
            allowCredentials: true
            exposedHeaders:
              - Authorization

jwt:
  secret: ${JWT_SECRET:ZGVjbGl0ZWNoLXNlY3VyZS1rZXktZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9uLTIwMjYtdmVyeS1zZWN1cmUtY2hhbmdlLWluLXByb2R1Y3Rpb24=}

gateway:
  secret: ${GATEWAY_SECRET:declitech-gateway-secret-dev-change-in-production}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.declitech.gateway: INFO
    org.springframework.cloud.gateway: WARN
