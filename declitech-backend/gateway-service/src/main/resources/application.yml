server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:

        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/auth/**

        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/users/**

        - id: module-service
          uri: ${MODULE_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/modules/**

        - id: alerts
          uri: ${REPORT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/alerts/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

        - id: reports-track
          uri: ${REPORT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/reports/track
            - Method=POST

        - id: emotions
          uri: ${REPORT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/emotions/**
          filters:
            - RewritePath=/api/emotions(?<segment>.*), /api/reports${segment}

        - id: reports
          uri: ${REPORT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/reports/**

        - id: recommendations
          uri: ${REPORT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/recommendations/**

        - id: sessions-join
          uri: ${SESSION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/sessions/join/**
            - Method=POST

        - id: sessions
          uri: ${SESSION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/sessions/**

        - id: agent-gateway
          uri: ${REPORT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/agent/**

      default-filters:
        - name: AddResponseHeader
          args:
            name: X-Content-Type-Options
            value: nosniff
        - name: AddResponseHeader
          args:
            name: X-Frame-Options
            value: DENY
        - name: AddResponseHeader
          args:
            name: X-XSS-Protection
            value: "1; mode=block"
        - name: AddResponseHeader
          args:
            name: Referrer-Policy
            value: strict-origin-when-cross-origin
        - name: AddResponseHeader
          args:
            name: Permissions-Policy
            value: "camera=(), microphone=(), geolocation=()"

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - ${FRONTEND_URL:http://localhost:4200}
              - http://54.39.97.174:8000
              - https://app.decli.tech
              - https://learn.decli.tech
              - chrome-extension://*
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - X-Requested-With
            allowCredentials: true
            exposedHeaders:
              - Authorization

iam:
  jwks-url: ${IAM_JWKS_URL:https://iam-staging.decli.tech/.well-known/jwks.json}

jwt:
  secret: ${JWT_SECRET}

gateway:
  secret: ${GATEWAY_SECRET}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${ACTUATOR_SHOW_DETAILS:when-authorized}

logging:
  level:
    com.declitech.gateway: INFO
    org.springframework.cloud.gateway: WARN
